<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whittier Narrows Nature Center – Plant Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest:   #1e4d2b;
    --forest2:  #2d6a3f;
    --forest3:  #4a9462;
    --sage:     #7ab893;
    --mint:     #b8dcc8;
    --cream:    #f4f9f6;
    --card:     #ffffff;
    --text:     #1a2e22;
    --muted:    #5a7a64;
    --border:   #c8e0d2;
    --shadow:   0 2px 14px rgba(30,77,43,.10);
    --gold:     #c8a94a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ────────────────────────────── */
  header {
    background: linear-gradient(135deg, #0f2b18 0%, #1e4d2b 45%, #2d6a3f 100%);
    color: #fff;
    padding: 36px 24px 28px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.22);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  header .leaf-deco {
    font-size: 42px;
    display: block;
    margin-bottom: 10px;
    position: relative;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 38px);
    font-weight: 700;
    letter-spacing: .3px;
    position: relative;
  }
  header p {
    margin-top: 8px;
    opacity: .82;
    font-size: 15px;
    font-weight: 300;
    position: relative;
  }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 16px;
    flex-wrap: wrap;
    position: relative;
  }
  .stat-pill {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    color: rgba(255,255,255,.9);
    font-weight: 500;
  }

  /* ── Controls ──────────────────────────── */
  .controls {
    position: sticky; top: 0; z-index: 100;
    background: var(--forest);
    padding: 12px 20px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
  }
  .controls input, .controls select {
    padding: 8px 13px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-family: inherit;
    background: rgba(255,255,255,.93);
    color: var(--text);
    flex: 1 1 150px;
    min-width: 120px;
    outline: none;
    transition: box-shadow .15s;
  }
  .controls input:focus, .controls select:focus {
    box-shadow: 0 0 0 3px var(--sage);
  }
  .controls .count {
    color: rgba(255,255,255,.82);
    font-size: 13px;
    white-space: nowrap;
    font-weight: 500;
    margin-left: auto;
  }

  /* ── Category divider ──────────────────── */
  .cat-divider {
    background: var(--forest2);
    color: #fff;
    padding: 11px 24px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .5px;
    margin-top: 32px;
    border-left: 6px solid var(--sage);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cat-divider span {
    font-weight: 300;
    font-size: 13px;
    opacity: .75;
  }

  /* ── Grid ──────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px 20px 10px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── Card ──────────────────────────────── */
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .18s, box-shadow .18s;
    display: flex;
    flex-direction: column;
    border: 1.5px solid var(--border);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 32px rgba(30,77,43,.16);
  }

  /* ── Card image area ───────────────────── */
  .card-img-wrap {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #d4eddf 0%, #b8dcc8 100%);
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    display: block; object-fit: cover;
    object-position: center center;
    transition: transform .3s;
  }
  .card:hover .card-img-wrap img { transform: scale(1.04); }
  .no-photo {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; padding: 28px 16px;
    color: var(--muted); font-size: 13px;
    width: 100%;
  }
  .no-photo .plant-icon { font-size: 44px; opacity: .55; }

  /* Status badge on image */
  .status-badge {
    position: absolute; top: 10px; left: 10px;
    font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px;
    letter-spacing: .4px;
    backdrop-filter: blur(6px);
  }
  .status-native    { background: rgba(30,77,43,.82); color: #fff; }
  .status-nonnative { background: rgba(160,60,30,.82); color: #fff; }

  /* Edibility badge on image */
  .ed-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px;
    letter-spacing: .4px;
  }
  .ed-Edible     { background: #2d6a3f; color: #fff; }
  .ed-Caution    { background: #b86b00; color: #fff; }
  .ed-Poisonous  { background: #8b1a1a; color: #fff; }
  .ed-Not-edible { background: rgba(80,80,80,.75); color: #fff; }

  /* ── Card body ─────────────────────────── */
  .card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px; font-weight: 700;
    color: var(--forest); line-height: 1.3;
  }
  .card-cat {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
    background: var(--mint); color: var(--forest);
    letter-spacing: .3px; margin-top: 2px;
  }

  /* Info rows */
  .info-block { display: flex; flex-direction: column; gap: 7px; }
  .info-row {
    display: grid; grid-template-columns: 22px 72px 1fr;
    align-items: flex-start; gap: 6px; font-size: 13px;
  }
  .info-icon { text-align: center; font-size: 14px; margin-top: 1px; }
  .info-label { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }
  .info-text  { color: var(--text); line-height: 1.45; }

  /* Location badge */
  .location-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    background: #e8f4ee; color: var(--forest2);
    border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 20px;
    margin-top: 2px; width: fit-content;
  }

  /* Notes */
  .notes-text {
    font-size: 12px; font-style: italic;
    color: var(--muted); background: #f0f9f4;
    border-left: 3px solid var(--sage);
    padding: 5px 9px; border-radius: 0 6px 6px 0;
  }

  /* Google link button */
  .google-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 4px; padding: 7px 14px;
    background: var(--forest); color: #fff;
    border-radius: 8px; font-size: 12px; font-weight: 600;
    text-decoration: none; letter-spacing: .2px;
    transition: background .15s, transform .1s;
    width: fit-content;
  }
  .google-btn:hover { background: var(--forest2); transform: translateY(-1px); }
  .google-btn svg { flex-shrink: 0; }

  /* ── Footer ────────────────────────────── */
  footer {
    text-align: center;
    padding: 28px 20px;
    color: var(--muted);
    font-size: 13px;
    margin-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* ── Empty state ───────────────────────── */
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 16px;
  }
</style>
</head>
<body>

<header>
  <span class="leaf-deco">🌿</span>
  <h1>Whittier Narrows Nature Center</h1>
  <p>Southern California Plant Identification Guide</p>
  <div class="stats-bar">
    <span class="stat-pill" id="totalCount">377 plants</span>
    <span class="stat-pill" id="nativeCount">🌱 Native</span>
    <span class="stat-pill" id="nonNativeCount">🌐 Non-native</span>
  </div>
</header>

<div class="controls">
  <input type="text"   id="searchBox"   placeholder="🔍  Search plants…" oninput="render()">
  <select id="catSel"  onchange="render()">
    <option value="">All categories</option>
    <option value="Tree">🌳 Tree</option>
    <option value="Shrub">🌿 Shrub</option>
    <option value="Herb">🌸 Herb / Wildflower</option>
    <option value="Grass">🌾 Grass / Sedge</option>
    <option value="Fern">🌿 Fern</option>
    <option value="Cactus">🌵 Cactus / Succulent</option>
    <option value="Vine">🍃 Vine</option>
    <option value="Palm">🌴 Palm</option>
  </select>
  <select id="statusSel" onchange="render()">
    <option value="">Native &amp; Non-native</option>
    <option value="Native">🌱 Native only</option>
    <option value="Non-native">🌐 Non-native only</option>
  </select>
  <select id="edSel" onchange="render()">
    <option value="">All edibility</option>
    <option value="Edible">✅ Edible</option>
    <option value="Caution">⚠️ Use caution</option>
    <option value="Poisonous">☠️ Poisonous</option>
    <option value="Not edible">🚫 Not edible</option>
  </select>
  <select id="locSel" onchange="render()">
    <option value="">All locations</option>
  </select>
  <span class="count" id="countLabel">377 of 377</span>
</div>

<main id="main"></main>

<footer>
  🌿 Whittier Narrows Nature Center — Southern California Plant Guide &nbsp;|&nbsp; 377 plants documented
</footer>

  wrap.prepend(div);
}

// Category icons
const catIcon = {
  Tree:"🌳", Shrub:"🌿", Herb:"🌸", Grass:"🌾",
  Fern:"🌿", Cactus:"🌵", Vine:"🍃", Palm:"🌴"
};

// Edibility icons
const edIcon = {
  "Edible":"✅", "Caution":"⚠️", "Poisonous":"☠️", "Not edible":"🚫"
};

// ── Populate location dropdown ─────────────
const locs = [...new Set(plants.map(p => p[5]).filter(l => l && l !== "?" && l !== ""))].sort();
const locSel = document.getElementById("locSel");
locs.forEach(l => {
  const o = document.createElement("option");
  o.value = l; o.textContent = "📍 " + l;
  locSel.appendChild(o);
});

// ── Stats in header ────────────────────────
const nativeTotal    = plants.filter(p => p[1] === "Native").length;
const nonNativeTotal = plants.filter(p => p[1] === "Non-native").length;
document.getElementById("totalCount").textContent    = plants.length + " plants";
document.getElementById("nativeCount").textContent   = "🌱 Native: " + nativeTotal;
document.getElementById("nonNativeCount").textContent = "🌐 Non-native: " + nonNativeTotal;

// ── Plant no-photo icon by category ───────
function plantIcon(cat) {
  return catIcon[cat] || "🌱";
}

// ── Build one card ─────────────────────────
function buildCard(p) {
  const [name, status, cat, ed, usage, loc, img, notes, link] = p;
  const edClass = "ed-" + ed.replace(/ /g, "-");
  const statusClass = status === "Native" ? "status-native" : "status-nonnative";
  const usageHtml = usage ? `
    <div class="info-row">
      <span class="info-icon">🛠️</span>
      <span class="info-label">Usage</span>
      <span class="info-text">${usage}</span>
    </div>` : "";
  const locHtml = loc && loc !== "?" ? `
    <div class="location-tag">📍 ${loc}</div>` : "";
  const notesHtml = notes ? `<div class="notes-text">📝 ${notes}</div>` : "";
  const linkHtml = link ? `
    <a class="google-btn" href="${link}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Search on Google
    </a>` : "";

  return `
  <div class="card">
    <div class="card-img-wrap">
      ${img ? `<img src="images/${img}" alt="${name}" loading="lazy" onerror="imgFallback(this)">` : `<div class="no-photo"><span class="plant-icon">${plantIcon(cat)}</span><span>Photo coming soon</span></div>`}
      <span class="status-badge ${statusClass}">${status}</span>
      <span class="ed-badge ${edClass}">${edIcon[ed] || ""} ${ed}</span>
    </div>
    <div class="card-body">
      <div>
        <div class="card-name">${name}</div>
        <span class="card-cat">${catIcon[cat] || "🌱"} ${cat}</span>
      </div>
      <div class="info-block">
        ${usageHtml}
      </div>
      ${locHtml}
      ${notesHtml}
      ${linkHtml}
    </div>
  </div>`;
}

// ── Main render ────────────────────────────
function render() {
  const q      = document.getElementById("searchBox").value.toLowerCase().trim();
  const cat    = document.getElementById("catSel").value;
  const status = document.getElementById("statusSel").value;
  const ed     = document.getElementById("edSel").value;
  const loc    = document.getElementById("locSel").value;

  let filtered = plants.filter(p => {
    if (cat    && p[2] !== cat)    return false;
    if (status && p[1] !== status) return false;
    if (ed     && p[3] !== ed)     return false;
    if (loc    && p[5] !== loc)    return false;
    if (q && ![p[0],p[2],p[3],p[4],p[5]].some(v => v.toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById("countLabel").textContent =
    filtered.length + " of " + plants.length + " plants";

  const main = document.getElementById("main");
  if (!filtered.length) {
    main.innerHTML = '<div class="grid"><div class="empty-msg">🔍 No plants match your search.</div></div>';
    return;
  }

  // Group by category
  const order = ["Tree","Shrub","Herb","Grass","Fern","Cactus","Vine","Palm"];
  const groups = {};
  filtered.forEach(p => {
    (groups[p[2]] = groups[p[2]] || []).push(p);
  });
  const groupKeys = order.filter(k => groups[k]).concat(
    Object.keys(groups).filter(k => !order.includes(k))
  );

  let html = "";
  groupKeys.forEach(c => {
    const grp = groups[c];
    html += `<div class="cat-divider">${catIcon[c] || "🌱"} ${c} <span>(${grp.length} plants)</span></div>`;
    html += '<div class="grid">';
    grp.forEach(p => html += buildCard(p));
    html += '</div>';
  });

  main.innerHTML = html;
}

render();
</script>
</body>
</html>
